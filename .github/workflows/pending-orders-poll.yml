# Scheduled pending-order escalation + pickup-delay admin alerts (no performance web required).
#
# Cron auth (same value as Vercel env CRON_SECRET), either:
#   A) Repository secret SAHLA_CRON_SECRET (Settings → Secrets → Actions → Repository secrets), or
#   B) GitHub Environment "SAHLA_CRON_SECRET" with an environment secret named CRON_SECRET (your current setup).
# Optional:
#   SAHLA_PENDING_ORDERS_POLL_URL — override poll URL (defaults to www.sahla-delivery.com below)
#   VERCEL_AUTOMATION_BYPASS_SECRET — if Deployment Protection is on (Vercel bypass token)
#
# If no secret resolves, scheduled runs exit 0 with a notice; workflow_dispatch fails.

name: Pending orders poll

on:
  schedule:
    - cron: '*/2 * * * *'
  workflow_dispatch:

concurrency:
  group: sahla-pending-orders-poll
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Exposes environment secret CRON_SECRET (must match Vercel CRON_SECRET). Create env "SAHLA_CRON_SECRET" in repo Settings → Environments if missing.
    environment: SAHLA_CRON_SECRET
    steps:
      - name: GET /api/internal/pending-orders-poll
        shell: bash
        env:
          URL: ${{ secrets.SAHLA_PENDING_ORDERS_POLL_URL }}
          SAHLA_REPO_CRON: ${{ secrets.SAHLA_CRON_SECRET }}
          ENV_CRON: ${{ secrets.CRON_SECRET }}
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail
          SECRET="${SAHLA_REPO_CRON:-${ENV_CRON:-}}"
          if [[ -z "${SECRET:-}" ]]; then
            if [[ "${GITHUB_EVENT_NAME:-}" == "workflow_dispatch" ]]; then
              echo "::error::Set Vercel CRON_SECRET, then either (1) GitHub repo secret SAHLA_CRON_SECRET or (2) Environment SAHLA_CRON_SECRET → secret CRON_SECRET."
              exit 1
            fi
            echo "::notice::Set cron auth (see workflow header) to enable scheduled polls."
            exit 0
          fi
          POLL_URL="${URL:-https://www.sahla-delivery.com/api/internal/pending-orders-poll}"
          args=(-fsS -H "Authorization: Bearer ${SECRET}")
          if [[ -n "${BYPASS:-}" ]]; then
            args+=(-H "x-vercel-protection-bypass: ${BYPASS}")
          fi
          curl "${args[@]}" "$POLL_URL"
          echo
