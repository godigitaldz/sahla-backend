# Scheduled pending-order escalation + pickup-delay admin alerts (no performance web required).
#
# Required repository secret:
#   SAHLA_CRON_SECRET — same value as Vercel CRON_SECRET
# Optional:
#   SAHLA_PENDING_ORDERS_POLL_URL — override poll URL (defaults to www.sahla-delivery.com below)
#   VERCEL_AUTOMATION_BYPASS_SECRET — if Deployment Protection is on (Vercel bypass token)
#
# Scheduled runs: if SAHLA_CRON_SECRET is missing, exits 0 with a notice (no spam).
# workflow_dispatch: fails if SAHLA_CRON_SECRET is missing so misconfiguration is visible.

name: Pending orders poll

on:
  schedule:
    - cron: '*/2 * * * *'
  workflow_dispatch:

concurrency:
  group: sahla-pending-orders-poll
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: GET /api/internal/pending-orders-poll
        shell: bash
        env:
          URL: ${{ secrets.SAHLA_PENDING_ORDERS_POLL_URL }}
          SECRET: ${{ secrets.SAHLA_CRON_SECRET }}
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail
          if [[ -z "${SECRET:-}" ]]; then
            if [[ "${GITHUB_EVENT_NAME:-}" == "workflow_dispatch" ]]; then
              echo "::error::Set repository secret SAHLA_CRON_SECRET (same as Vercel CRON_SECRET)."
              exit 1
            fi
            echo "::notice::Set SAHLA_CRON_SECRET to enable scheduled polls (no performance dashboard needed)."
            exit 0
          fi
          POLL_URL="${URL:-https://www.sahla-delivery.com/api/internal/pending-orders-poll}"
          args=(-fsS -H "Authorization: Bearer ${SECRET}")
          if [[ -n "${BYPASS:-}" ]]; then
            args+=(-H "x-vercel-protection-bypass: ${BYPASS}")
          fi
          curl "${args[@]}" "$POLL_URL"
          echo
